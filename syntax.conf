# ved syntax highlighting config
# syntax <name> <ext>...
# rule <regex> <color or attributes...>

syntax go .go .golang
rule \b(func|if|else|for|range|var|const|return|package|import|type|struct|switch|case|default|break|continue|go|defer|select|chan|map|interface)\b bold
rule "(\\\\.|[^"\\\\])*" yellow
rule '(\\\\.|[^'\\\\])*' yellow
rule //.*$ gray
rule \b([0-9]+)\b cyan

syntax py .py
rule \b(def|class|if|elif|else|for|while|in|import|from|return|try|except|finally|with|as|lambda|pass|break|continue|and|or|not|None|True|False)\b bold
rule #.*$ gray
rule "(\\\\.|[^"\\\\])*" yellow
rule '(\\\\.|[^'\\\\])*' yellow

syntax sh .sh .bash
rule \b(if|then|else|fi|for|while|do|done|case|esac|function|echo|exit|return|local|export)\b bold
rule #.*$ gray
rule "[^"]*" yellow
rule \$[A-Za-z_][A-Za-z0-9_]* cyan
